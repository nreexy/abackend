{% extends "base.html" %}

{% block content %}
<!-- Main Flex Container -->
<div class="d-flex w-100" style="height: calc(100vh - 56px); overflow: hidden;">

    <!-- LEFT SIDEBAR: Collections -->
    <div class="bg-light border-end d-flex flex-column flex-shrink-0" style="width: 250px; overflow-y: auto;">
        <div class="p-3">
            <h6 class="text-uppercase text-muted fw-bold small">Collections</h6>
            <div class="list-group list-group-flush mt-3">
                {% for col in collections %}
                <button type="button" class="list-group-item list-group-item-action py-2 collection-btn"
                    data-collection="{{ col }}" onclick="selectCollection('{{ col }}')">
                    <i class="bi bi-table me-2 text-secondary"></i> {{ col }}
                </button>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- RIGHT CONTENT: Split Pane -->
    <div class="d-flex flex-column flex-grow-1" style="min-width: 0;">

        <!-- TOP PANE: Query -->
        <div class="p-3 border-bottom bg-white" style="height: 35%; min-height: 200px; flex-shrink: 0;">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="m-0"><i class="bi bi-code-square"></i> Query <span id="activeCollectionBadge"
                        class="badge bg-primary ms-2">Select a Collection</span></h5>
                <button class="btn btn-primary" onclick="runQuery()" id="runBtn" disabled>
                    <i class="bi bi-play-fill"></i> Run Query
                </button>
            </div>

            <div class="form-floating h-75">
                <textarea class="form-control font-monospace" placeholder="Enter JSON Query" id="queryInput"
                    style="height: 100%; border: 1px solid #ced4da;">{}</textarea>
                <label for="queryInput" class="text-muted">MongoDB Query (JSON)</label>
            </div>
            <div class="form-text small text-muted mt-1">Example: <code>{"asin": "12345"}</code> or
                <code>{"provider": "Audible"}</code></div>
        </div>

        <!-- BOTTOM PANE: Results -->
        <div class="flex-grow-1 bg-light p-0 position-relative d-flex flex-column" style="min-height: 0;">
            <div class="p-2 border-bottom bg-light d-flex justify-content-between flex-shrink-0">
                <span class="small fw-bold text-muted">Results</span>
                <span class="small text-muted" id="resultCount"></span>
            </div>
            <div class="table-responsive flex-grow-1 p-3" id="resultsContainer">
                <div class="text-center text-muted mt-5 py-5">
                    <i class="bi bi-arrow-left-circle display-4"></i>
                    <p class="mt-3">Select a collection to view data.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let activeCollection = null;

    function selectCollection(name) {
        activeCollection = name;
        document.querySelectorAll('.collection-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`button[data-collection="${name}"]`).classList.add('active');

        document.getElementById('activeCollectionBadge').innerText = name;
        document.getElementById('runBtn').disabled = false;

        // Auto Run simple query on select
        document.getElementById('queryInput').value = "{}";
        runQuery();
    }

    async function runQuery() {
        if (!activeCollection) return;

        const btn = document.getElementById('runBtn');
        const container = document.getElementById('resultsContainer');
        const countLabel = document.getElementById('resultCount');
        const originalText = btn.innerHTML;

        // Loading State
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Running...';
        container.style.opacity = '0.5';

        const queryStr = document.getElementById('queryInput').value;

        try {
            const response = await fetch('/database/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ collection: activeCollection, query: queryStr })
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(text || response.statusText);
            }

            const data = await response.json();
            renderTable(data);
            countLabel.innerText = `${data.items.length} records found (Limit 50)`;

        } catch (err) {
            container.innerHTML = `<div class="alert alert-danger m-3"><i class="bi bi-exclamation-triangle-fill"></i> Error: ${err.message}</div>`;
            countLabel.innerText = "Error";
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
            container.style.opacity = '1';
        }
    }

    function renderTable(data) {
        const container = document.getElementById('resultsContainer');

        if (!data.items || data.items.length === 0) {
            container.innerHTML = '<div class="alert alert-info m-3">No records found.</div>';
            return;
        }

        const keys = data.keys; // Sorted keys from backend

        let html = '<table class="table table-sm table-hover table-bordered bg-white small mb-5">'; // Added mb-5 for scroll space

        // Header
        html += '<thead class="table-light"><tr>';
        keys.forEach(k => {
            html += `<th scope="col" style="white-space: nowrap;">${k}</th>`;
        });
        html += '</tr></thead>';

        // Body
        html += '<tbody>';
        data.items.forEach(item => {
            html += '<tr>';
            keys.forEach(k => {
                let val = item[k];
                if (val === undefined || val === null) val = "";
                else if (typeof val === 'object') val = JSON.stringify(val).substring(0, 50) + (JSON.stringify(val).length > 50 ? "..." : ""); // Truncate objects
                else val = String(val).substring(0, 100); // Truncate strings

                html += `<td class="text-truncate" style="max-width: 200px;" title="${String(item[k]).replace(/"/g, '&quot;')}">${val}</td>`;
            });
            html += '</tr>';
        });
        html += '</tbody></table>';

        container.innerHTML = html;
    }
</script>

{% endblock %}
